[package]
name = "ax_ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
description = "A Slint desktop SSH workspace built on russh"
publish = false
readme = "README.md"

[dependencies]
anyhow = "1"
directories = "6"
keyring = "4.1.5"
portable-pty = "0.9.0"
russh = "0.62.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.17.1", default-features = false, features = ["backend-winit", "compat-1-2", "raw-window-handle-06", "renderer-software", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSObject", "NSString", "std"] }
raw-window-handle = "0.6.2"

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
rand = "0.10"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
