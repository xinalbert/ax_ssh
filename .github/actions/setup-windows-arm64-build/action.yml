name: Set up Windows ARM64 build
description: Select the native LLVM and Visual Studio tools for AWS-LC and Skia.
runs:
  using: composite
  steps:
    - name: Select native Windows ARM64 compiler tools
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) {
          throw 'Visual Studio ARM64 C++ tools are unavailable'
        }
        $pathBeforeDevShell = $env:PATH -split ';'
        Import-Module (Join-Path $vsInstall 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $vsInstall -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'
        if ($env:VSCMD_ARG_TGT_ARCH -ne 'arm64' -or $env:VSCMD_ARG_HOST_ARCH -ne 'arm64') {
          throw 'Visual Studio did not select the native ARM64 toolchain'
        }
        foreach ($requiredVariable in @('INCLUDE', 'LIB')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($requiredVariable))) {
            throw "Visual Studio did not configure $requiredVariable"
          }
        }
        $vcInstall = Join-Path $vsInstall 'VC'
        $llvmRoot = Join-Path $env:ProgramFiles 'LLVM'
        $llvmBin = Join-Path $llvmRoot 'bin'
        $clangCl = Join-Path $llvmBin 'clang-cl.exe'
        $libclang = Join-Path $llvmBin 'libclang.dll'
        foreach ($required in @($vcInstall, $clangCl, $libclang)) {
          if (-not (Test-Path $required)) {
            throw "Windows ARM64 build tool is unavailable: $required"
          }
        }
        & $clangCl --version
        if ($LASTEXITCODE -ne 0) {
          throw 'clang-cl failed to run'
        }
        @(
          "CC_aarch64_pc_windows_msvc=$clangCl"
          "CXX_aarch64_pc_windows_msvc=$clangCl"
          "LLVM_HOME=$llvmRoot"
          "LIBCLANG_PATH=$llvmBin"
        ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        foreach ($variable in @('INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_ARG_HOST_ARCH')) {
          $value = [Environment]::GetEnvironmentVariable($variable)
          if (-not [string]::IsNullOrWhiteSpace($value)) {
            "$variable=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
        $env:PATH -split ';' | Where-Object { $_ -and ($_ -notin $pathBeforeDevShell) } |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
