name: Create Dated Release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Same-day release revision (0 for the first release, 1 for the second)
        required: true
        default: "0"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-dated-release-${{ github.ref_name }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  create:
    outputs:
      release_tag: ${{ steps.release_ref.outputs.tag }}
    if: github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Shanghai release version
        shell: bash
        run: python scripts/release_version.py env --timezone Asia/Shanghai --revision "${{ inputs.revision }}" >> "$GITHUB_ENV"

      - name: Refuse an existing release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

      - name: Synchronize release metadata
        shell: bash
        run: python scripts/release_version.py sync --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Commit and tag release
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/macos/Info.plist
          if ! git diff --cached --quiet; then
            git commit -m "Release ${RELEASE_TAG}"
          fi
          git tag -a "$RELEASE_TAG" -m "AxSSH ${RELEASE_PUBLIC_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$RELEASE_TAG"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  continue-release:
    needs: create
    uses: ./.github/workflows/retry-existing-release.yml
    permissions:
      actions: write
      contents: read
    with:
      tag: ${{ needs.create.outputs.release_tag }}
