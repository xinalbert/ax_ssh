name: Retry Existing Release

on:
  push:
    tags: ["20*-*-*"]
  workflow_call:
    inputs:
      tag:
        description: Existing annotated release tag to retry (YYYY-MM-DD[-N])
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to retry (YYYY-MM-DD[-N])
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-existing-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  dispatch-tagged-ci:
    if: github.event_name == 'push' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release_ref.outputs.sha }}
      release_tag: ${{ steps.release_ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify the existing release tag and metadata
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = tag
          python scripts/release_version.py verify --tag "$RELEASE_TAG"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "${tag_ref}^{}")" >> "$GITHUB_OUTPUT"

      - name: Dispatch CI for the existing tag
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              ref: process.env.RELEASE_TAG,
            });

  wait-for-ci:
    needs: dispatch-tagged-ci
    runs-on: ubuntu-latest
    steps:
      - name: Wait for tagged CI and dispatch Release
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ needs.dispatch-tagged-ci.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.dispatch-tagged-ci.outputs.release_tag }}
        with:
          script: |
            const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const attempts = 180;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                per_page: 100,
              });
              const run = data.workflow_runs.find((candidate) =>
                candidate.event === "workflow_dispatch"
                  && candidate.head_branch === process.env.RELEASE_TAG
                  && candidate.head_sha === process.env.RELEASE_SHA,
              );
              if (!run || run.status !== "completed") {
                await delay(15000);
                continue;
              }
              if (run.conclusion !== "success") {
                throw new Error(`CI for ${process.env.RELEASE_TAG} finished with ${run.conclusion}`);
              }
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "release.yml",
                ref: process.env.RELEASE_TAG,
                inputs: { tag: process.env.RELEASE_TAG },
              });
              return;
            }
            throw new Error(`timed out waiting for CI for ${process.env.RELEASE_TAG}`);
