name: Release

on:
  push:
    tags: ["20*-*-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify annotated tag and release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          git show-ref --verify --quiet "$tag_ref"
          test "$(git cat-file -t "$tag_ref")" = tag
          python scripts/release_version.py verify --tag "$RELEASE_TAG"

  build:
    name: ${{ matrix.name }}
    needs: verify-release-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            binary: ax_ssh.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            binary: ax_ssh
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            binary: ax_ssh
            deb_arch: arm64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-aarch64
            binary: ax_ssh
            macos_arch: arm64
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
            binary: ax_ssh
            macos_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve and verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_version.py verify --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set build revision
        shell: bash
        run: echo "AXSSH_BUILD_REVISION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo files
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="AxSSH.app"
          AXSSH_BINARY_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            packaging/macos/build-app.sh "$app"
          binary="$app/Contents/MacOS/AxSSH"
          lipo "$binary" -verify_arch "${{ matrix.macos_arch }}"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          asset="AxSSH-${RELEASE_PUBLIC_VERSION}-${{ matrix.name }}.zip"
          ditto -c -k --keepParent "$app" "$asset"
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "AxSSH-$env:RELEASE_PUBLIC_VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "$stage/assets/fonts" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/AxSSH.exe"
          Copy-Item "assets/fonts/." "$stage/assets/fonts" -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md "$stage/"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "ASSET_PATH=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Linux archives
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          stage="AxSSH-${RELEASE_PUBLIC_VERSION}-${{ matrix.name }}"
          mkdir -p "$stage/assets/fonts"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/ax_ssh"
          cp -R assets/fonts/. "$stage/assets/fonts/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"

          deb_root="${stage}-deb"
          mkdir -p \
            "$deb_root/DEBIAN" \
            "$deb_root/usr/bin" \
            "$deb_root/usr/share/applications" \
            "$deb_root/usr/share/ax_ssh/assets/fonts" \
            "$deb_root/usr/share/doc/axssh"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$deb_root/usr/bin/ax_ssh"
          chmod 755 "$deb_root/usr/bin/ax_ssh"
          cp packaging/linux/axssh.desktop "$deb_root/usr/share/applications/axssh.desktop"
          cp -R assets/fonts/. "$deb_root/usr/share/ax_ssh/assets/fonts/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$deb_root/usr/share/doc/axssh/"
          for size in 16 24 32 48 64 128 256 512 1024; do
            icon_directory="$deb_root/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_directory"
            cp "assets/ion/terminal_icon_all_formats/terminal_icon_${size}.png" "$icon_directory/axssh.png"
          done
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: axssh
          Version: ${RELEASE_DEBIAN_VERSION}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: AxSSH contributors
          Section: net
          Priority: optional
          Description: Cross-platform terminal workspace for SSH, Telnet, and serial sessions
          EOF
          chmod 644 "$deb_root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$deb_root" "${stage}.deb"
          {
            echo "ASSET_PATHS<<EOF"
            echo "${stage}.tar.gz"
            echo "${stage}.deb"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ env.ASSET_PATHS || env.ASSET_PATH }}
          if-no-files-found: error

  macos-universal:
    name: macos-universal
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve and verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_version.py verify --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download macOS ARM64 application
        uses: actions/download-artifact@v4
        with:
          name: release-macos-aarch64
          path: dist/macos-aarch64

      - name: Download macOS x86_64 application
        uses: actions/download-artifact@v4
        with:
          name: release-macos-x86_64
          path: dist/macos-x86_64

      - name: Assemble universal macOS application
        shell: bash
        run: |
          set -euo pipefail
          arm_archive="$(find dist/macos-aarch64 -type f -name '*.zip' -print -quit)"
          x86_archive="$(find dist/macos-x86_64 -type f -name '*.zip' -print -quit)"
          if [ -z "$arm_archive" ] || [ -z "$x86_archive" ]; then
            echo "macOS architecture artifact is missing" >&2
            exit 1
          fi
          mkdir -p expanded/arm64 expanded/x86_64
          ditto -x -k "$arm_archive" expanded/arm64
          ditto -x -k "$x86_archive" expanded/x86_64
          arm_app="expanded/arm64/AxSSH.app"
          x86_app="expanded/x86_64/AxSSH.app"
          arm_binary="$arm_app/Contents/MacOS/AxSSH"
          x86_binary="$x86_app/Contents/MacOS/AxSSH"
          if [ ! -f "$arm_binary" ] || [ ! -f "$x86_binary" ]; then
            echo "macOS application binary is missing" >&2
            exit 1
          fi
          app="AxSSH.app"
          cp -R "$arm_app" "$app"
          universal_binary="$app/Contents/MacOS/AxSSH"
          lipo -create "$arm_binary" "$x86_binary" -output "$universal_binary"
          chmod 755 "$universal_binary"
          lipo "$universal_binary" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          asset="AxSSH-${RELEASE_PUBLIC_VERSION}-macos-universal.zip"
          ditto -c -k --keepParent "$app" "$asset"
          echo "ASSET_PATH=$asset" >> "$GITHUB_ENV"

      - name: Upload universal macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Resolve and verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_version.py verify --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate release highlights
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_highlights.py \
            --tag "$RELEASE_TAG" \
            --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output release/body.md
          cat release/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AxSSH ${{ env.RELEASE_PUBLIC_VERSION }}
          files: dist/**/*
          body_path: release/body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
